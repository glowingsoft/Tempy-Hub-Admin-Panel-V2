name: CI/CD for DEV Environment

on:
  push:
    branches:
      - dev

jobs:
  deploy-fe:
    runs-on: ubuntu-latest

    env:
      CI: false
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Define environment variables from REACT_ENV_FILE_DEV
        run: |
          rm -f .env
          echo "${{ secrets.REACT_ENV_FILE_DEV }}" > .env

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --force

      - name: Build React app
        run: npm run build   # CI=false already set globally

      - name: Create PEM file from Secret
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

      - name: Zip build with timestamp
        run: |
          TIMESTAMP=$(date +"%Y%m%d%H%M%S")
          ZIP_NAME="build-$TIMESTAMP.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          cd dist && zip -r "../$ZIP_NAME" . && cd ..

      - name: Upload zipped build to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no "$ZIP_NAME" \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/

      - name: Deploy on EC2 (create dirs + perms + deploy + rollback)
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -euo pipefail

            ZIP_NAME=${{ env.ZIP_NAME }}
            HTML_DIR="/var/www/html-dev"
            BACKUP_DIR="/var/www/html-dev-backups"
            TEMP_DIR="/tmp/html-dev-new"

            echo "[INFO] Ensuring directories exist..."
            sudo mkdir -p "$HTML_DIR" "$BACKUP_DIR" "$TEMP_DIR"

            echo "[INFO] Setting permissions..."
            sudo chown -R $USER:$USER "$HTML_DIR" "$BACKUP_DIR" "$TEMP_DIR"

            echo "[INFO] Checking unzip installation..."
            if ! command -v unzip &>/dev/null; then
              sudo apt-get update && sudo apt-get install -y unzip
            fi

            echo "[INFO] Unzipping new build..."
            sudo unzip -o "/tmp/$ZIP_NAME" -d "$TEMP_DIR"

            TS=$(date +"%Y%m%d%H%M%S")

            if [ -d "$HTML_DIR" ]; then
              echo "[INFO] Backing up current build..."
              sudo mv "$HTML_DIR" "$BACKUP_DIR/html-dev-$TS"
            fi

            echo "[INFO] Deploying new build..."
            if sudo mv "$TEMP_DIR" "$HTML_DIR"; then
              echo "[SUCCESS] Build deployed."
            else
              echo "[ERROR] Deployment failed. Rolling back..."
              LATEST_BACKUP=$(ls -td $BACKUP_DIR/html-dev-* 2>/dev/null | head -n 1)
              [ -n "$LATEST_BACKUP" ] && sudo mv "$LATEST_BACKUP" "$HTML_DIR"
              exit 1
            fi

            sudo chown -R $USER:$USER "$HTML_DIR"

            echo "[INFO] Cleaning old backups..."
            cd "$BACKUP_DIR"
            sudo ls -1tr | head -n -3 | xargs -d '\n' -r sudo rm -rf
          EOF

      - name: Clean up local ZIP file
        run: |
          [ -f "$ZIP_NAME" ] && rm "$ZIP_NAME"
